name: Publish Codex++ platform
description: Stage and retain one verified platform tarball before publishing it.
inputs:
  version: {required: true, description: Release version}
  target: {required: true, description: Native target triple}
  platform: {required: true, description: npm platform tag}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.12"
    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: "24"
        registry-url: https://registry.npmjs.org
        package-manager-cache: false
    - name: Pin npm
      shell: bash
      run: npm install --global npm@11.18.0
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: codex-plus-plus-native-${{ inputs.target }}
        path: dist/archives
    - name: Resolve retained platform tarball
      id: retained
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ARTIFACT_NAME: codex-plus-plus-npm-platform-${{ inputs.platform }}
      run: |
        set -euo pipefail
        retained="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
          --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\" and .expired == false) | .id")"
        if [[ -n "$retained" ]]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      if: steps.retained.outputs.found == 'true'
      with:
        name: codex-plus-plus-npm-platform-${{ inputs.platform }}
        path: dist/npm
    - name: Stage platform payload
      if: steps.retained.outputs.found != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        python scripts/codex_package/codex_plus_plus/release.py hydrate \
          --version "$VERSION" --platform "$PLATFORM" --archives-dir dist/archives --vendor-dir dist/vendor
        python scripts/stage_npm_packages.py --release-version "$VERSION" \
          --package "codex-plus-plus-${PLATFORM}" --vendor-src dist/vendor --output-dir dist/npm
        cd dist/npm
        for tarball in *.tgz; do sha256sum "$tarball" > "$tarball.sha256"; done
    - name: Verify platform payload
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        (cd dist/npm && sha256sum --check *.sha256)
        python scripts/codex_package/codex_plus_plus/release.py verify \
          --version "$VERSION" --platform "$PLATFORM" --archives-dir dist/archives --npm-dir dist/npm
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: steps.retained.outputs.found != 'true'
      with:
        name: codex-plus-plus-npm-platform-${{ inputs.platform }}
        path: dist/npm/*
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
    - name: Publish and confirm platform
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        python scripts/codex_package/codex_plus_plus/release.py publish \
          --version "$VERSION" --platform "$PLATFORM" --npm-dir dist/npm
