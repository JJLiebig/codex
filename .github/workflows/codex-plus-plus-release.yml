name: Codex++ release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Failed Codex++ release workflow run to recover
        required: true
        type: string
      release_tag:
        description: Existing Codex++ release tag owned by the source run
        required: true
        type: string
  push:
    branches:
      - main
    tags:
      - "codex-plus-plus-v*"
    paths:
      - ".github/actions/setup-msvc-env/**"
      - ".github/actions/setup-rusty-v8/**"
      - ".github/scripts/install-musl-build-tools.sh"
      - ".github/workflows/codex-plus-plus-release.yml"
      - "codex-rs/**"
      - "scripts/build_codex_plus_plus.py"
      - "scripts/build_codex_package.py"
      - "scripts/codex_package/**"
      - ".github/scripts/build-windows-voice.ps1"
      - "third_party/voice/**"

permissions: {}

concurrency:
  group: codex-plus-plus-release-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

env:
  CODEX_REPO_ROOT: ${{ github.workspace }}
  APT_UPDATE_ARGS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
  APT_INSTALL_ARGS: --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/codex-plus-plus-v')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      recovery: ${{ steps.version.outputs.recovery }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      source_run_id: ${{ steps.version.outputs.source_run_id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate release tag
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
            source_run_id="$INPUT_SOURCE_RUN_ID"
            recovery=true
          else
            release_tag="$GITHUB_REF_NAME"
            source_run_id="$GITHUB_RUN_ID"
            recovery=false
          fi

          [[ "$source_run_id" =~ ^[0-9]+$ ]] || {
            echo "Invalid source workflow run: ${source_run_id}"
            exit 1
          }
          version="${release_tag#codex-plus-plus-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-fork\.[0-9]+$ ]] || {
            echo "Invalid Codex++ release tag: ${release_tag}"
            exit 1
          }

          if [[ "$recovery" == "true" ]]; then
            workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/codex-plus-plus-release.yml" --jq .id)"
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}")"
            run_workflow_id="$(jq -r .workflow_id <<<"$run")"
            run_status="$(jq -r .status <<<"$run")"
            run_conclusion="$(jq -r .conclusion <<<"$run")"
            run_event="$(jq -r .event <<<"$run")"
            run_tag="$(jq -r .head_branch <<<"$run")"
            run_sha="$(jq -r .head_sha <<<"$run")"
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${release_tag}" --jq .sha)"
            [[ "$run_workflow_id" == "$workflow_id" && "$run_status" == "completed" && "$run_conclusion" == "failure" && "$run_event" == "push" && "$run_tag" == "$release_tag" && "$run_sha" == "$tag_sha" ]] || {
              echo "Run ${source_run_id} is not a failed Codex++ release for ${release_tag} at ${tag_sha}"
              exit 1
            }
            workspace_manifest="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/contents/codex-rs/Cargo.toml" -f "ref=${release_tag}" --jq .content | base64 --decode)"
          else
            workspace_manifest="$(cat codex-rs/Cargo.toml)"
          fi

          base_version="${version%%-fork.*}"
          workspace_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' <<<"$workspace_manifest" | head -1)"
          [[ "$base_version" == "$workspace_version" ]] || {
            echo "Tag base ${base_version} does not match workspace ${workspace_version}"
            exit 1
          }

          echo "recovery=$recovery" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release helpers
        run: |
          python scripts/codex_package/test_build_codex_plus_plus.py
          python scripts/codex_package/tests/test_source_mtime_cache.py
          python scripts/codex_package/tests/test_codex_plus_plus_release.py
          python scripts/codex_package/tests/test_voice.py
          python -m py_compile \
            scripts/build_codex_plus_plus.py \
            scripts/codex_package/codex_plus_plus/source_mtime_cache.py \
            scripts/codex_package/codex_plus_plus/release.py

  warm-build-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      AWS_LC_SYS_NO_JITTER_ENTROPY: ${{ matrix.target == 'x86_64-unknown-linux-musl' && '1' || '' }}
      AWS_LC_SYS_NO_JITTER_ENTROPY_x86_64_unknown_linux_musl: ${{ matrix.target == 'x86_64-unknown-linux-musl' && '1' || '' }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      LIBSQLITE3_FLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'SQLITE_DISABLE_INTRINSIC' || '' }}
      SOURCE_MTIME_STATE: codex-rs/target/codex-plus-plus-source-mtimes-${{ matrix.target }}.json
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Remove runner-provided Rust toolchain
        shell: bash
        run: rustup toolchain uninstall stable

      - name: Configure LLVM linker
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Resolve release build cache identity
        id: release-cache
        shell: bash
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          image="${ImageOS:-${RUNNER_OS}}-${ImageVersion:-unknown}"
          toolchain="${{ hashFiles('codex-rs/rust-toolchain.toml') }}"
          build_inputs="${{ hashFiles('.github/actions/setup-msvc-env/**', '.github/actions/setup-rusty-v8/**', '.github/scripts/install-musl-build-tools.sh', '.github/workflows/codex-plus-plus-release.yml') }}"
          prefix="codex-plus-plus-release-v4-${TARGET}-${image}-${toolchain}-${build_inputs}"
          echo "key=${prefix}-${tree}" >> "$GITHUB_OUTPUT"
          echo "prefix=${prefix}-" >> "$GITHUB_OUTPUT"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"

      - name: Restore Codex++ release build cache
        id: restore-build-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.release-cache.outputs.key }}
          restore-keys: |
            ${{ steps.release-cache.outputs.prefix }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/codex-package
            codex-rs/target/release
            codex-rs/target/${{ matrix.target }}/release
            codex-rs/target/.rustc_info.json
            ${{ env.SOURCE_MTIME_STATE }}

      - name: Regenerate v8 after cache restore
        working-directory: codex-rs
        shell: bash
        run: |
          cargo clean -p v8 --target "$TARGET" --profile release
          rm -rf "target/${TARGET}/release/gn_out"

      - name: Install Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i '\|azure\.archive\.ubuntu\.com|d' /etc/apt/apt-mirrors.txt
            grep -qE '^[[:space:]]*https?://' /etc/apt/apt-mirrors.txt || { echo "No apt mirror remains" >&2; exit 1; }
          fi
          bash .github/scripts/install-musl-build-tools.sh

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build bundled bwrap
        if: runner.os == 'Linux'
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --target "$TARGET" --profile release --bin bwrap
          bwrap="target/${TARGET}/release/bwrap"
          digest="$(sha256sum "$bwrap" | awk '{print $1}')"
          echo "BWRAP=${GITHUB_WORKSPACE}/codex-rs/${bwrap}" >> "$GITHUB_ENV"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"

      - name: Warm full-release build
        shell: bash
        run: |
          package_args=(
            --cargo-profile release
            --target "$TARGET"
            --package-dir "dist/cache-package-${TARGET}"
            --force
          )
          if [[ -n "${BWRAP:-}" ]]; then
            package_args+=(--bwrap-bin "$BWRAP")
          fi
          python scripts/build_codex_plus_plus.py \
            --suffix cache \
            --build-cache-state "$SOURCE_MTIME_STATE" \
            -- \
            "${package_args[@]}"

      - name: Save Codex++ release build cache
        if: steps.restore-build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.release-cache.outputs.key }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/codex-package
            codex-rs/target/release
            codex-rs/target/${{ matrix.target }}/release
            codex-rs/target/.rustc_info.json
            ${{ env.SOURCE_MTIME_STATE }}

  build:
    needs: prepare
    if: needs.prepare.outputs.recovery == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive_suffix: zip
            executable: bin/codex.exe
          - runner: macos-15
            target: aarch64-apple-darwin
            archive_suffix: tar.gz
            executable: bin/codex
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive_suffix: tar.gz
            executable: bin/codex
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      AWS_LC_SYS_NO_JITTER_ENTROPY: ${{ matrix.target == 'x86_64-unknown-linux-musl' && '1' || '' }}
      AWS_LC_SYS_NO_JITTER_ENTROPY_x86_64_unknown_linux_musl: ${{ matrix.target == 'x86_64-unknown-linux-musl' && '1' || '' }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.prepare.outputs.version }}
      ARCHIVE_SUFFIX: ${{ matrix.archive_suffix }}
      LIBSQLITE3_FLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'SQLITE_DISABLE_INTRINSIC' || '' }}
      SOURCE_MTIME_STATE: codex-rs/target/codex-plus-plus-source-mtimes-${{ matrix.target }}.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Remove runner-provided Rust toolchain
        shell: bash
        run: rustup toolchain uninstall stable

      - name: Configure LLVM linker
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Resolve release build cache identity
        id: release-cache
        shell: bash
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          image="${ImageOS:-${RUNNER_OS}}-${ImageVersion:-unknown}"
          toolchain="${{ hashFiles('codex-rs/rust-toolchain.toml') }}"
          build_inputs="${{ hashFiles('.github/actions/setup-msvc-env/**', '.github/actions/setup-rusty-v8/**', '.github/scripts/install-musl-build-tools.sh', '.github/workflows/codex-plus-plus-release.yml') }}"
          prefix="codex-plus-plus-release-v4-${TARGET}-${image}-${toolchain}-${build_inputs}"
          echo "key=${prefix}-${tree}" >> "$GITHUB_OUTPUT"
          echo "prefix=${prefix}-" >> "$GITHUB_OUTPUT"
          echo "tree=${tree}" >> "$GITHUB_OUTPUT"

      - name: Restore Codex++ release build cache
        id: restore-build-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.release-cache.outputs.key }}
          restore-keys: |
            ${{ steps.release-cache.outputs.prefix }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/codex-package
            codex-rs/target/release
            codex-rs/target/${{ matrix.target }}/release
            codex-rs/target/.rustc_info.json
            ${{ env.SOURCE_MTIME_STATE }}

      - name: Regenerate v8 after cache restore
        working-directory: codex-rs
        shell: bash
        run: |
          cargo clean -p v8 --target "$TARGET" --profile release
          rm -rf "target/${TARGET}/release/gn_out"

      - name: Install Zig
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i '\|azure\.archive\.ubuntu\.com|d' /etc/apt/apt-mirrors.txt
            grep -qE '^[[:space:]]*https?://' /etc/apt/apt-mirrors.txt || { echo "No apt mirror remains" >&2; exit 1; }
          fi
          bash .github/scripts/install-musl-build-tools.sh

      - name: Configure rusty_v8 artifact overrides and verify checksums
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build bundled bwrap
        if: runner.os == 'Linux'
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --target "$TARGET" --profile release --bin bwrap
          bwrap="target/${TARGET}/release/bwrap"
          digest="$(sha256sum "$bwrap" | awk '{print $1}')"
          echo "BWRAP=${GITHUB_WORKSPACE}/codex-rs/${bwrap}" >> "$GITHUB_ENV"
          echo "CODEX_BWRAP_SHA256=${digest}" >> "$GITHUB_ENV"

      - name: Build package archive
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/codex-plus-plus-${VERSION}-${TARGET}.${ARCHIVE_SUFFIX}"
          package_args=(
            --target "$TARGET"
            --package-dir "dist/package-${TARGET}"
            --archive-output "$archive"
            --force
          )
          if [[ -n "${BWRAP:-}" ]]; then
            package_args+=(--bwrap-bin "$BWRAP")
          fi
          python scripts/build_codex_plus_plus.py \
            --fork-version "$VERSION" \
            --build-cache-state "$SOURCE_MTIME_STATE" \
            -- \
            --cargo-profile release \
            "${package_args[@]}"

      - name: Build and package Windows voice
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'codex-plus-plus-voice'
          & .github/scripts/build-windows-voice.ps1 -Output $work
          if ($LASTEXITCODE -ne 0) { throw 'Voice build failed' }
          $commit = git rev-parse HEAD
          python scripts/codex_package/codex_plus_plus/voice.py package `
            --work $work --commit $commit `
            --app "dist/package-$env:TARGET" --output "dist/voice-package-$env:TARGET" `
            --archive "dist/codex-plus-plus-$env:VERSION-$env:TARGET.$env:ARCHIVE_SUFFIX"
          if ($LASTEXITCODE -ne 0) { throw 'Voice package or relocated startup smoke failed' }

      - name: Smoke package
        shell: bash
        env:
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          set -euo pipefail
          executable="dist/package-${TARGET}/${EXECUTABLE}"
          [[ "$("$executable" --version)" == "codex-cli ${VERSION}" ]]

      - name: Stage release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-plus-plus-native-${{ matrix.target }}
          path: dist/codex-plus-plus-${{ env.VERSION }}-${{ matrix.target }}.${{ matrix.archive_suffix }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  stage-npm:
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.18.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-plus-plus-native-*
          path: dist/archives
          merge-multiple: true

      - name: Stage exact npm payloads
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python scripts/codex_package/codex_plus_plus/release.py hydrate \
            --version "$VERSION" --archives-dir dist/archives --vendor-dir dist/vendor
          python scripts/stage_npm_packages.py --release-version "$VERSION" \
            --package codex-plus-plus --vendor-src dist/vendor --output-dir dist/npm
          python scripts/codex_package/codex_plus_plus/release.py verify \
            --version "$VERSION" --archives-dir dist/archives --npm-dir dist/npm
          cd dist/npm
          for tarball in *.tgz; do sha256sum "$tarball" > "$tarball.sha256"; done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-plus-plus-npm-${{ needs.prepare.outputs.version }}
          path: dist/npm/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-npm:
    needs:
      - prepare
      - stage-npm
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.prepare.outputs.recovery == 'true' || needs.stage-npm.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.release_tag }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.18.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: codex-plus-plus-npm-${{ needs.prepare.outputs.version }}
          path: dist/npm
          run-id: ${{ needs.prepare.outputs.source_run_id }}

      - name: Publish npm platforms before latest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          (cd dist/npm && sha256sum --check *.sha256)
          python scripts/codex_package/codex_plus_plus/release.py publish \
            --version "$VERSION" --npm-dir dist/npm --dry-run
          python scripts/codex_package/codex_plus_plus/release.py publish \
            --version "$VERSION" --npm-dir dist/npm

  publish-github:
    needs:
      - prepare
      - build
      - stage-npm
      - publish-npm
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.publish-npm.result == 'success' &&
      (needs.prepare.outputs.recovery == 'true' ||
      (needs.build.result == 'success' && needs.stage-npm.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.release_tag }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          pattern: codex-plus-plus-native-*
          path: dist/archives
          merge-multiple: true
          run-id: ${{ needs.prepare.outputs.source_run_id }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: codex-plus-plus-npm-${{ needs.prepare.outputs.version }}
          path: dist/npm
          run-id: ${{ needs.prepare.outputs.source_run_id }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir dist/release
          cp dist/archives/* dist/npm/* scripts/install/install-codex-plus-plus*.sh \
            scripts/install/install-codex-plus-plus*.ps1 dist/release/
          cd dist/release
          for asset in codex-plus-plus-*.tar.gz codex-plus-plus-*.zip install-*.sh install-*.ps1; do
            sha256sum "$asset" > "$asset.sha256"
          done
          cd ../..
          notes="${RUNNER_TEMP}/release-notes.md"
          cat > "$notes" <<EOF
          Codex++ ${VERSION}, based on upstream Codex ${VERSION%%-fork.*}.

          npm package: @jjliebig/codex-plus-plus
          Standalone unsigned builds: Windows x64, macOS ARM64, and Linux x64.
          EOF
          assets=(dist/release/*)

          if release_is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq .isDraft 2>/dev/null)"; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "Codex++ ${VERSION}" \
              --generate-notes \
              --notes "$(cat "$notes")"
            release_is_draft=true
          fi
          if [[ "$release_is_draft" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi

      - name: Delete intermediate artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.prepare.outputs.source_run_id }}
        run: |
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("codex-plus-plus-native-") or startswith("codex-plus-plus-npm-")) | .id' |
          while read -r artifact_id; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
