name: Codex++ release

on:
  workflow_dispatch:
    inputs:
      publish_windows_linux_launcher:
        description: Publish the pinned fork.2 launcher using ready Windows/Linux and prior macOS
        type: boolean
        default: false
      source_run_id:
        description: Failed Codex++ release workflow run to recover
        required: true
        type: string
      release_tag:
        description: Existing Codex++ release tag owned by the source run
        required: true
        type: string
  push:
    tags:
      - "codex-plus-plus-v*"

permissions: {}

concurrency:
  group: codex-plus-plus-release-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: false

env:
  CODEX_REPO_ROOT: ${{ github.workspace }}
  APT_UPDATE_ARGS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
  APT_INSTALL_ARGS: --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30

jobs:
  prepare:
    if: inputs.publish_windows_linux_launcher != true
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      recovery: ${{ steps.version.outputs.recovery }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      source_run_id: ${{ steps.version.outputs.source_run_id }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate release tag
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_RELEASE_TAG"
            source_run_id="$INPUT_SOURCE_RUN_ID"
            recovery=true
          else
            release_tag="$GITHUB_REF_NAME"
            source_run_id="$GITHUB_RUN_ID"
            recovery=false
          fi

          [[ "$source_run_id" =~ ^[0-9]+$ ]] || {
            echo "Invalid source workflow run: ${source_run_id}"
            exit 1
          }
          version="${release_tag#codex-plus-plus-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-fork\.[0-9]+$ ]] || {
            echo "Invalid Codex++ release tag: ${release_tag}"
            exit 1
          }

          if [[ "$recovery" == "true" ]]; then
            workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/codex-plus-plus-release.yml" --jq .id)"
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}")"
            run_workflow_id="$(jq -r .workflow_id <<<"$run")"
            run_status="$(jq -r .status <<<"$run")"
            run_conclusion="$(jq -r .conclusion <<<"$run")"
            run_event="$(jq -r .event <<<"$run")"
            run_tag="$(jq -r .head_branch <<<"$run")"
            run_sha="$(jq -r .head_sha <<<"$run")"
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${release_tag}" --jq .sha)"
            [[ "$run_workflow_id" == "$workflow_id" && "$run_status" == "completed" && "$run_conclusion" == "failure" && "$run_event" == "push" && "$run_tag" == "$release_tag" && "$run_sha" == "$tag_sha" ]] || {
              echo "Run ${source_run_id} is not a failed Codex++ release for ${release_tag} at ${tag_sha}"
              exit 1
            }
            workspace_manifest="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/contents/codex-rs/Cargo.toml" -f "ref=${release_tag}" --jq .content | base64 --decode)"
          else
            workspace_manifest="$(cat codex-rs/Cargo.toml)"
          fi

          base_version="${version%%-fork.*}"
          workspace_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' <<<"$workspace_manifest" | head -1)"
          [[ "$base_version" == "$workspace_version" ]] || {
            echo "Tag base ${base_version} does not match workspace ${workspace_version}"
            exit 1
          }

          echo "source_sha=${run_sha:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "recovery=$recovery" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release helpers
        run: |
          python scripts/codex_package/test_build_codex_plus_plus.py
          python scripts/codex_package/tests/test_source_mtime_cache.py
          python scripts/codex_package/tests/test_codex_plus_plus_release.py
          python scripts/codex_package/tests/test_voice.py
          python -m py_compile \
            scripts/build_codex_plus_plus.py \
            scripts/codex_package/codex_plus_plus/source_mtime_cache.py \
            scripts/codex_package/codex_plus_plus/release.py

  build-windows:
    needs: prepare
    if: needs.prepare.outputs.recovery == 'false'
    uses: ./.github/workflows/codex-plus-plus-build.yml
    permissions:
      contents: read
      actions: read
    with:
      version: ${{ needs.prepare.outputs.version }}
      runner: windows-latest
      target: x86_64-pc-windows-msvc
      archive_suffix: zip
      executable: bin/codex.exe

  assets-windows:
    needs: [prepare, build-windows]
    uses: ./.github/workflows/codex-plus-plus-publish-assets.yml
    permissions:
      actions: read
      contents: write
    with:
      version: ${{ needs.prepare.outputs.version }}
      source_run_id: ${{ needs.prepare.outputs.source_run_id }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      target: x86_64-pc-windows-msvc

  publish-windows:
    needs: [prepare, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/publish-codex-plus-plus-platform
        with:
          version: ${{ needs.prepare.outputs.version }}
          target: x86_64-pc-windows-msvc
          platform: win32-x64

  build-macos:
    needs: prepare
    if: needs.prepare.outputs.recovery == 'false'
    uses: ./.github/workflows/codex-plus-plus-build.yml
    permissions:
      contents: read
      actions: read
    with:
      version: ${{ needs.prepare.outputs.version }}
      runner: macos-15
      target: aarch64-apple-darwin
      archive_suffix: tar.gz
      executable: bin/codex

  assets-macos:
    needs: [prepare, build-macos]
    uses: ./.github/workflows/codex-plus-plus-publish-assets.yml
    permissions:
      actions: read
      contents: write
    with:
      version: ${{ needs.prepare.outputs.version }}
      source_run_id: ${{ needs.prepare.outputs.source_run_id }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      target: aarch64-apple-darwin

  publish-macos:
    needs: [prepare, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/publish-codex-plus-plus-platform
        with:
          version: ${{ needs.prepare.outputs.version }}
          target: aarch64-apple-darwin
          platform: darwin-arm64

  build-linux:
    needs: prepare
    if: needs.prepare.outputs.recovery == 'false'
    uses: ./.github/workflows/codex-plus-plus-build.yml
    permissions:
      contents: read
      actions: read
    with:
      version: ${{ needs.prepare.outputs.version }}
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-musl
      archive_suffix: tar.gz
      executable: bin/codex

  assets-linux:
    needs: [prepare, build-linux]
    uses: ./.github/workflows/codex-plus-plus-publish-assets.yml
    permissions:
      actions: read
      contents: write
    with:
      version: ${{ needs.prepare.outputs.version }}
      source_run_id: ${{ needs.prepare.outputs.source_run_id }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      target: x86_64-unknown-linux-musl

  publish-linux:
    needs: [prepare, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/publish-codex-plus-plus-platform
        with:
          version: ${{ needs.prepare.outputs.version }}
          target: x86_64-unknown-linux-musl
          platform: linux-x64

  stage-npm:
    needs:
      - prepare
      - build-windows
      - build-macos
      - build-linux
      - publish-windows
      - publish-macos
      - publish-linux
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.recovery == 'false' &&
      needs.build-windows.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-linux.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "26.12.1"
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.18.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-plus-plus-native-*
          path: dist/archives
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codex-plus-plus-npm-platform-*
          path: dist/npm
          merge-multiple: true

      - name: Stage exact npm payloads
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          (cd dist/npm && sha256sum --check *.sha256)
          python scripts/codex_package/codex_plus_plus/release.py hydrate \
            --version "$VERSION" --archives-dir dist/archives --vendor-dir dist/vendor
          python codex-cli/scripts/build_npm_package.py --release-version "$VERSION" \
            --package codex-plus-plus --vendor-src dist/vendor \
            --pack-output "dist/npm/codex-plus-plus-npm-${VERSION}.tgz"
          python scripts/codex_package/codex_plus_plus/release.py verify \
            --version "$VERSION" --archives-dir dist/archives --npm-dir dist/npm
          cd dist/npm
          for tarball in *.tgz; do sha256sum "$tarball" > "$tarball.sha256"; done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-plus-plus-npm-${{ needs.prepare.outputs.version }}
          path: dist/npm/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish-npm:
    needs:
      - prepare
      - stage-npm
      - publish-windows
      - publish-macos
      - publish-linux
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.prepare.outputs.recovery == 'true' ||
      (needs.stage-npm.result == 'success' &&
      needs.publish-windows.result == 'success' &&
      needs.publish-macos.result == 'success' &&
      needs.publish-linux.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.release_tag }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "26.12.1"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@11.18.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: codex-plus-plus-npm-${{ needs.prepare.outputs.version }}
          path: dist/npm
          run-id: ${{ needs.prepare.outputs.source_run_id }}

      - name: Publish npm platforms before latest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          (cd dist/npm && sha256sum --check *.sha256)
          python scripts/codex_package/codex_plus_plus/release.py publish \
            --version "$VERSION" --npm-dir dist/npm --dry-run
          python scripts/codex_package/codex_plus_plus/release.py publish \
            --version "$VERSION" --npm-dir dist/npm

  publish-github:
    concurrency:
      group: codex-plus-plus-publication
      queue: max
      cancel-in-progress: false
    needs:
      - prepare
      - assets-windows
      - assets-macos
      - assets-linux
      - build-windows
      - build-macos
      - build-linux
      - stage-npm
      - publish-npm
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.publish-npm.result == 'success' &&
      (needs.prepare.outputs.recovery == 'true' ||
      (needs.build-windows.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-linux.result == 'success' && needs.stage-npm.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          pattern: codex-plus-plus-native-*
          path: dist/archives
          merge-multiple: true
          run-id: ${{ needs.prepare.outputs.source_run_id }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: codex-plus-plus-npm-${{ needs.prepare.outputs.version }}
          path: dist/npm
          run-id: ${{ needs.prepare.outputs.source_run_id }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          python scripts/codex_package/codex_plus_plus/github_release.py \
            --version "$VERSION" --source-sha "$SOURCE_SHA" \
            --archives-dir dist/archives --npm-dir dist/npm

      - name: Delete intermediate artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.prepare.outputs.source_run_id }}
        run: |
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("codex-plus-plus-native-") or startswith("codex-plus-plus-npm-")) | .id' |
          while read -r artifact_id; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

  publish-windows-linux-launcher:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_windows_linux_launcher
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: codex-plus-plus-publication
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: 5f73d5b8d64006f7315f31a849a61b3706e8b340
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "26.12.1"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.18.0
      - name: Stage the pinned launcher with published platform dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          from urllib.parse import quote
          from urllib.request import urlopen

          version = "0.167.1-fork.2"
          source = "5f73d5b8d64006f7315f31a849a61b3706e8b340"
          package = "@jjliebig/codex-plus-plus"
          expected = {
              f"{package}-linux-x64": f"npm:{package}@{version}-linux-x64",
              f"{package}-win32-x64": f"npm:{package}@{version}-win32-x64",
              f"{package}-darwin-arm64": f"npm:{package}@0.167.1-fork.1-darwin-arm64",
          }
          assert os.environ["RELEASE_TAG"] == f"codex-plus-plus-v{version}"
          assert os.environ["SOURCE_RUN_ID"] == "43223899813"
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == source
          remote = json.loads(subprocess.check_output([
              "gh", "api", f"repos/JJLiebig/codex/commits/{os.environ['RELEASE_TAG']}"
          ]))
          assert remote["sha"] == source
          subprocess.run([
              "python", "codex-cli/scripts/build_npm_package.py",
              "--package", "codex-plus-plus", "--release-version", version,
              "--staging-dir", "dist/root",
          ], check=True)
          manifest_path = Path("dist/root/package.json")
          manifest = json.loads(manifest_path.read_text())
          assert manifest["name"] == package and manifest["version"] == version
          assert manifest["optionalDependencies"] == {
              alias: f"npm:{package}@{version}-{alias.removeprefix(package + '-')}"
              for alias in expected
          }
          manifest["optionalDependencies"] = expected
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          registry = {}
          for alias, dependency in expected.items():
              spec = dependency.removeprefix("npm:")
              url = f"https://registry.npmjs.org/{quote(package, safe='')}/{spec.rsplit('@', 1)[1]}"
              with urlopen(url, timeout=30) as response:
                  metadata = json.load(response)
              assert metadata["version"] == spec.rsplit("@", 1)[1]
              platform, arch = alias.removeprefix(package + "-").rsplit("-", 1)
              assert metadata["os"] == [platform] and metadata["cpu"] == [arch]
              registry[alias] = metadata["dist"]["integrity"]
          Path("dist/npm").mkdir(parents=True)
          packed = json.loads(subprocess.check_output([
              "npm", "--workspaces=false", "pack", "./dist/root", "--json", "--pack-destination", "dist/npm"
          ]))[0]
          tarball = Path("dist/npm") / packed["filename"]
          integrity = "sha512-" + base64.b64encode(hashlib.sha512(tarball.read_bytes()).digest()).decode()
          assert packed["integrity"] == integrity
          receipt = {"source_sha": source, "version": version, "dependencies": expected,
                     "platform_integrities": registry, "integrity": integrity}
          Path("dist/npm/receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write(f"ROOT_TARBALL={tarball}\nROOT_INTEGRITY={integrity}\n")
          print(json.dumps(receipt, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-plus-plus-fork2-ready-launcher
          path: dist/npm/*
          retention-days: 7
      - name: Verify the staged launcher selects the published Linux fix
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/launcher-smoke"
          npm install --prefix "$prefix" --ignore-scripts --no-audit --no-fund "$ROOT_TARBALL"
          actual=$("$prefix/node_modules/.bin/codex" --version)
          [[ "$actual" == 'codex-cli 0.167.1-fork.2' ]]
      - name: Publish launcher and verify registry integrity
        env:
          VERSION: 0.167.1-fork.2
        run: |
          set -euo pipefail
          spec="@jjliebig/codex-plus-plus@$VERSION"
          current=$(npm view "$spec" dist.integrity --json 2>/dev/null || true)
          if [[ "$current" != "\"$ROOT_INTEGRITY\"" ]]; then
            [[ -z "$current" || "$current" == *'"E404"'* ]] || { echo "Conflicting published launcher"; exit 1; }
            npm publish "$ROOT_TARBALL" --access public --tag latest --provenance
          fi
          for attempt in $(seq 1 60); do
            current=$(npm view "$spec" dist.integrity --json 2>/dev/null || true)
            latest=$(npm view @jjliebig/codex-plus-plus dist-tags.latest --json)
            if [[ "$current" == "\"$ROOT_INTEGRITY\"" && "$latest" == "\"$VERSION\"" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Published launcher was not confirmed in the registry"
          exit 1
