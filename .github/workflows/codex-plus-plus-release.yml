name: Codex++ release
run-name: Codegen comparison - ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Release run whose source commit will be compared
        required: true
        type: string
      release_tag:
        description: Existing release tag used for the package version
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Resolve the release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          python - <<'PY'
          import json, os
          source = json.load(open('source-run.json'))
          tag = os.environ['RELEASE_TAG']
          assert source['head_branch'] == tag
          assert tag.startswith('codex-plus-plus-v')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('source_sha=' + source['head_sha'] + '\n')
              out.write('version=' + tag.removeprefix('codex-plus-plus-v') + '\n')
          PY

  build-linux:
    needs: prepare
    uses: ./.github/workflows/codex-plus-plus-build.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      version: ${{ needs.prepare.outputs.version }}
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-musl
      archive_suffix: tar.gz
      executable: bin/codex
