name: Codex++ release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        type: string
      release_tag:
        required: true
        type: string

permissions: {}

jobs:
  recover-launcher:
    if: github.ref == 'refs/heads/recovery/publish-windows-linux-169-fork1'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
    concurrency:
      group: codex-plus-plus-publication
      queue: max
      cancel-in-progress: false
    env:
      VERSION: 0.169.0-fork.1
      SOURCE_SHA: 01ada1b1c8e9beec53c32ab0e5c0637b77ab9f4b
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: 01ada1b1c8e9beec53c32ab0e5c0637b77ab9f4b
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "26.12.1"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify the source run and its Windows and Linux publications
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = JJLiebig/codex
          test "$SOURCE_RUN_ID" = 43419131862
          test "$RELEASE_TAG" = "codex-plus-plus-v$VERSION"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$SOURCE_SHA"
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$SOURCE_SHA" '
            .workflow_id == 311850962 and .event == "push" and .head_branch == $tag
            and .head_sha == $sha and .status == "completed" and .run_attempt >= 3
          ' <<<"$run"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" |
            jq -se '
              [.[].jobs[] | select(.conclusion == "success") | .name] |
              index("publish-windows") != null and index("publish-linux") != null
            '
      - name: Pack the exact-tag launcher
        run: |
          set -euo pipefail
          npm install --global npm@11.18.0
          python codex-cli/scripts/build_npm_package.py --package codex-plus-plus \
            --release-version "$VERSION" --pack-output "dist/npm/codex-plus-plus-npm-$VERSION.tgz"
          sha256sum "dist/npm/codex-plus-plus-npm-$VERSION.tgz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-plus-plus-169-fork1-ready-launcher
          path: dist/npm/*.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Smoke-test the launcher against the published Linux payload
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/launcher-smoke"
          npm install --prefix "$prefix" --ignore-scripts --no-audit --no-fund \
            "./dist/npm/codex-plus-plus-npm-$VERSION.tgz"
          actual="$("$prefix/node_modules/.bin/codex" --version)"
          printf '%s\n' "$actual"
          test "$actual" = "codex-cli $VERSION"
      - name: Publish the launcher and verify npm latest
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import time

          sys.path.insert(0, "scripts/codex_package/codex_plus_plus")
          from release import PACKAGE_NAME, npm_view, read_manifest, tarball_integrity

          version = os.environ["VERSION"]
          root_spec = f"{PACKAGE_NAME}@{version}"
          tarball = Path(f"dist/npm/codex-plus-plus-npm-{version}.tgz")
          manifest = read_manifest(tarball)
          assert manifest["name"] == PACKAGE_NAME and manifest["version"] == version
          assert manifest["optionalDependencies"] == {
              f"{PACKAGE_NAME}-{tag}": f"npm:{root_spec}-{tag}"
              for tag in ("win32-x64", "linux-x64", "darwin-arm64")
          }
          for tag, expected in {
              "linux-x64": "sha512-6++gqPNHHL/DpieYmuB2V/rt2REzaST5MxwSi1CbcEftskqPuoSVDVORXKjPqRkGe2Aa3JOktc9oO8ZXN5gHDQ==",
              "win32-x64": "sha512-6fFBfgVlfFciggZukbh3HNISzz0ATJ5iG59WFz7YjwQ8x60/j1VpEuxY7WI7dhAgYXkhroFhFHupZtbHWPrF1w==",
          }.items():
              assert npm_view(f"{root_spec}-{tag}", "dist.integrity") == expected, tag

          latest = npm_view(PACKAGE_NAME, "dist-tags.latest")
          if npm_view(root_spec, "dist.integrity") is not None:
              assert latest == version, f"{root_spec} is already published; npm latest is {latest}"
              print(f"{root_spec} is already npm latest")
              sys.exit(0)
          pattern = r"(\d+)\.(\d+)\.(\d+)-fork\.(\d+)"
          assert latest and re.fullmatch(pattern, latest), f"Unexpected npm latest: {latest}"
          assert tuple(map(int, re.fullmatch(pattern, latest).groups())) < (0, 169, 0, 1), latest
          integrity = tarball_integrity(tarball)
          subprocess.run(
              ["npm", "publish", str(tarball), "--access", "public", "--tag", "latest", "--provenance"],
              check=True,
          )
          for attempt in range(120):
              current = npm_view(root_spec, "dist.integrity")
              assert current in (None, integrity), f"Unexpected integrity for {root_spec}: {current}"
              if current == integrity and npm_view(PACKAGE_NAME, "dist-tags.latest") == version:
                  print(f"Confirmed {root_spec} as latest with matching integrity")
                  break
              time.sleep(10)
          else:
              raise RuntimeError(f"Timed out confirming {root_spec} as latest")
          PY
