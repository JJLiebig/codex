name: Codex++ tests
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  fork_features:
    name: Codex++ feature tests (${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        package: [codex-core, codex-tui, codex-config, codex-model-provider, codex-install-context]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential pkg-config libcap-dev libasound2-dev bubblewrap
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103
      - name: Test fork-owned modules
        run: just test --lib -p ${{ matrix.package }} -E 'test(codex_plus_plus::)'
