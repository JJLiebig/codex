name: Publish ready Codex++ assets

on:
  workflow_call:
    inputs:
      version: {required: true, type: string}
      source_run_id: {required: true, type: string}
      source_sha: {required: true, type: string}
      target: {required: true, type: string}

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    concurrency:
      group: codex-plus-plus-publication
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: codex-plus-plus-native-${{ inputs.target }}
          path: dist/archives
          run-id: ${{ inputs.source_run_id }}
      - name: Append verified native assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET: ${{ inputs.target }}
        run: |
          python scripts/codex_package/codex_plus_plus/github_release.py \
            --version "$VERSION" --source-sha "$SOURCE_SHA" \
            --target "$TARGET" --archives-dir dist/archives
